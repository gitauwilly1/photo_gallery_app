{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Photo - PhotoGallery{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-red-600 px-6 py-4">
            <h1 class="text-xl font-bold text-white">Delete Photo</h1>
        </div>
        
        <div class="p-6 text-center">
            <svg class="mx-auto h-16 w-16 text-red-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
            
            <h2 class="text-xl font-bold text-gray-900 mb-2">Are you sure?</h2>
            <p class="text-gray-600 mb-4">
                You are about to delete "<strong>{{ photo.title }}</strong>". 
                This action cannot be undone.
            </p>
            
            <div class="flex gap-4">
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition">
                        <i class="fas fa-trash mr-2"></i>
                        Yes, Delete
                    </button>
                </form>
                <a href="{% url 'gallery:photo_detail' photo.slug %}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">
                    <i class="fas fa-times mr-2"></i>
                    Cancel
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
