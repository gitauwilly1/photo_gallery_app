services:
  - type: web
    name: photo-gallery-app
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: ./build.sh
    startCommand: gunicorn photogallery.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: RENDER
        value: true
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: photo-gallery-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: photo-gallery-app.onrender.com,.onrender.com,localhost,127.0.0.1

databases:
  - name: photo-gallery-db
    plan: free